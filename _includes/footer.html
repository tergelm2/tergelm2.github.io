<footer class="mt-auto py-3 text-center">

  <small class="text-muted mb-2">© {{ site.time | date: '%Y' }} {{ site.author.name }}</small>

  {% include social.html %}

</footer>

{% if page.custom_js %}
<!-- Custom page specific js files -->
  {% for js_file in page.custom_js %}
    <script src='{{ site.baseurl }}/assets/js/{{ js_file }}.js' type="text/javascript"></script>
  {% endfor %}
{% endif %}
